<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portal Aplikasi SMP 3 MSB</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .iframe-container {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh; /* Menyesuaikan tinggi layar HP secara akurat */
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Indikator memuat sementara sebelum tampilan Apps Script muncul */
    .loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #f8fafc;
      color: #475569;
      font-size: 14px;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #cbd5e1;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="iframe-container">
    <div id="loader" class="loader">
      <div class="spinner"></div>
      <span>Memuat aplikasi...</span>
    </div>

    <iframe 
      src="https://script.google.com/macros/s/AKfycbzz7ocI4IzMT5NOqNAjHYhlcehk6D9-hDntgBV9j5ChASuc_zzd2oO9UbiLSgNMJsafGQ/exec"
      title="Aplikasi Web SMP 3 MSB"
      allow="clipboard-read; clipboard-write; geolocation; camera; microphone"
       allowfullscreen
      onload="document.getElementById('loader').style.display='none';">
    </iframe>
  </div>

</body>
</html>
