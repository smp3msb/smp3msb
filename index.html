  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    
    .iframe-container {
      position: relative;
      width: 100%;
      height: 100vh; /* Setinggi layar penuh */
    }
    
    iframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }
    
    /* Indikator muat sementara sebelum tampilan Apps Script muncul */
    .loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #f8fafc;
      color: #475569;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #cbd5e1;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <div id="loader" class="loader">
      <div class="spinner"></div>
      <span>Memuat aplikasi...</span>
    </div>
    
    <!-- Pastikan link URL src di bawah ini sudah persis dengan link Web App Google Apps Script Anda -->
    <iframe 
      src="https://script.google.com/macros/s/AKfycbzZ20I4lz9ShpquEe1Kse_hnuTyHYsjaCha5aZzI2qOQs9safld/exec" 
      title="Aplikasi UPT SMPN 3 Satap Masamba"
      allow="clipboard-read; clipboard-write; geolocation; camera; microphone"
      allowfullscreen
      onload="document.getElementById('loader').style.display = 'none';">
    </iframe>
  </div>
</body>
